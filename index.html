<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>急救证书查询 · AHA Heartsaver</title>
<style>
  :root{--red:#C8102E;--red-d:#9e0c24;--ink:#1a1a1a;--muted:#6b7280;--bg:#f4f5f7;--card:#fff;--line:#e5e7eb;--radius:14px}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  header{background:linear-gradient(135deg,var(--red),var(--red-d));color:#fff;padding:26px 16px 22px;text-align:center}
  header h1{margin:0 0 4px;font-size:21px;font-weight:700;letter-spacing:.3px}
  header p{margin:0;font-size:13px;opacity:.9}
  .wrap{max-width:1150px;margin:0 auto;padding:16px}
  .tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;margin-top:-4px}
  .search{width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
  .search:focus{border-color:var(--red)}
  .count{font-size:13px;color:var(--muted);margin:8px 2px 0}
  .group{margin-top:10px}
  .ghead{display:flex;align-items:center;gap:10px;margin:18px 2px 10px}
  .ghead .tag{background:var(--red);color:#fff;font-size:14px;font-weight:700;padding:4px 12px;border-radius:999px}
  .ghead .gc{font-size:12.5px;color:var(--muted)}
  .ghead .line{flex:1;height:1px;background:var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
  .card:hover{box-shadow:0 6px 20px rgba(0,0,0,.09);transform:translateY(-2px)}
  .thumb{display:block;background:#fafafa;border-bottom:1px solid var(--line);aspect-ratio:1.6/1;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
  .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
  .name{font-size:17px;font-weight:700;margin:0;line-height:1.2}
  .name .en{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:2px}
  .rows{font-size:12.5px;color:var(--muted);line-height:1.55}
  .rows .k{display:inline-block;min-width:60px}
  .rows b{color:var(--ink);font-weight:600}
  .rows .en2{color:var(--muted);font-weight:400}
  .ecard{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:.3px}
  .btns{display:flex;gap:8px;margin-top:auto;padding-top:4px}
  .btn{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:600;padding:9px 0;border-radius:9px;border:1px solid var(--line);color:var(--ink);background:#fff}
  .btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
  .btn:active{opacity:.85}
  .empty{text-align:center;color:var(--muted);padding:40px;display:none}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 16px 32px}
  footer a{color:var(--muted)}
</style>
</head>

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function card(c){
  const sameName = !c.cn || c.cn===c.name;
  const nameHtml = sameName ? esc(c.name) : esc(c.cn)+'<span class="en">'+esc(c.name)+'</span>';
  return `<div class="card">
    <a class="thumb" href="pdfs/${encodeURIComponent(c.slug)}.pdf" target="_blank" rel="noopener">
      <img loading="lazy" src="thumbs/${encodeURIComponent(c.slug)}.png" alt="${esc(c.cn||c.name)} 证书">
    </a>
    <div class="body">
      <h3 class="name">${nameHtml}</h3>
      <div class="rows">
        <div><span class="k">证书编号</span><b class="ecard">${esc(c.ecard)}</b></div>
        <div><span class="k">签发日期</span><b>${esc(c.issue_cn)}</b> <span class="en2">${esc(c.issue)}</span></div>
        <div><span class="k">有效期至</span><b>${esc(c.renew_cn)}</b> <span class="en2">${esc(c.renew)}</span></div>
      </div>
      <div class="btns">
        <a class="btn" href="pdfs/${encodeURIComponent(c.slug)}.pdf" target="_blank" rel="noopener">查看 View</a>
        <a class="btn primary" href="pdfs/${encodeURIComponent(c.slug)}.pdf" download>下载 PDF</a>
      </div>
    </div></div>`;
}
function render(k){
  k=k.trim().toLowerCase();
  let shown=0, html='';
  for(const g of GROUPS){
    const items=!k?g.items:g.items.filter(c=>
      (c.cn||'').toLowerCase().includes(k)||c.name.toLowerCase().includes(k)||
      c.ecard.includes(k)||(c.team||'').toLowerCase().includes(k));
    if(!items.length) continue;
    shown+=items.length;
    html+=`<div class="group"><div class="ghead"><span class="tag">${esc(g.label)}</span>`+
          `<span class="gc">${items.length} 人</span><span class="line"></span></div>`+
          `<div class="grid">${items.map(card).join('')}</div></div>`;
  }
  wrap.innerHTML=html;
  count.textContent='显示 '+shown+' / '+TOTAL+' 张';
  empty.style.display=shown?'none':'block';
}
q.addEventListener('input',()=>render(q.value));
